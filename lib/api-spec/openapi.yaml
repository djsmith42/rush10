openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rush10
    description: Rush 10 multiplayer game operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rush10/rules:
    get:
      operationId: getRush10Rules
      tags: [rush10]
      summary: Get the Rush 10 phases and quick rules
      responses:
        "200":
          description: Game phases and turn rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rush10Rules"
  /rush10/rooms:
    post:
      operationId: createRush10Room
      tags: [rush10]
      summary: Create a new Rush 10 room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rush10RoomCreate"
      responses:
        "201":
          description: Created room and host session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rush10RoomSession"
        "400":
          description: Invalid player name
  /rush10/test-rooms:
    post:
      operationId: createRush10TestRoom
      tags: [rush10]
      summary: Create a seeded test room whose seats all belong to the caller
      description: >-
        Builds a brand-new room at random levels and scores for the test pages.
        It never touches an existing room, and every seat token is returned to
        the caller, so no one else can sit in it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rush10TestRoomCreate"
      responses:
        "201":
          description: Seeded room and one session per seat, host first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rush10TestRoom"
        "400":
          description: Invalid scenario or player count
  /rush10/rooms/{code}/join:
    post:
      operationId: joinRush10Room
      tags: [rush10]
      summary: Join an existing room
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rush10RoomJoin"
      responses:
        "200":
          description: Joined room and player session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rush10RoomSession"
        "400":
          description: Room is full or the request is invalid
        "404":
          description: Room not found
  /rush10/rooms/{code}/joinable:
    get:
      operationId: checkRush10RoomJoinable
      tags: [rush10]
      summary: Check that a room exists and can still be joined
      description: >-
        Lets the home page reject a bad code before asking for a name, and
        lets the name screen say who is already in the game.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The room is waiting for players and has a free seat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rush10RoomJoinable"
        "400":
          description: The game has started or the room is full
        "404":
          description: Room not found
  /rush10/rooms/{code}:
    get:
      operationId: getRush10Room
      tags: [rush10]
      summary: Get the public room state and this player's hand
      description: >-
        The player token goes in the Authorization header, never the URL,
        so polling does not write credentials to proxy access logs.
      security:
        - playerToken: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current game state visible to this player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rush10RoomView"
        "403":
          description: Invalid player token
        "404":
          description: Room not found
  /rush10/rooms/{code}/start:
    post:
      operationId: startRush10Game
      tags: [rush10]
      summary: Start the game as the room host
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/Rush10PlayerTokenInput"
      responses:
        "200":
          description: Game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rush10RoomView"
        "400":
          description: Not enough players or game already started
        "403":
          description: Invalid player token
        "404":
          description: Room not found
  /rush10/rooms/{code}/action:
    post:
      operationId: actInRush10Game
      tags: [rush10]
      summary: Draw, lay a phase, hit, or discard
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rush10PlayerAction"
      responses:
        "200":
          description: Action accepted and updated room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rush10RoomView"
        "400":
          description: Action is not legal
        "403":
          description: Invalid player token
        "404":
          description: Room not found
components:
  securitySchemes:
    playerToken:
      type: http
      scheme: bearer
      description: The playerToken returned when creating or joining a room.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Rush10Rules:
      type: object
      required: [phases, turnRules, scoring]
      properties:
        phases:
          type: array
          items:
            $ref: "#/components/schemas/Rush10Phase"
        turnRules:
          type: array
          items:
            type: string
        scoring:
          type: array
          items:
            type: string
    Rush10Phase:
      type: object
      required: [number, title, description]
      properties:
        number:
          type: integer
        title:
          type: string
        description:
          type: string
    Rush10RoomCreate:
      type: object
      required: [playerName]
      properties:
        playerName:
          type: string
          minLength: 1
          maxLength: 20
    Rush10RoomJoin:
      type: object
      required: [playerName]
      properties:
        playerName:
          type: string
          minLength: 1
          maxLength: 20
    Rush10RoomJoinable:
      type: object
      required: [roomCode, playerNames]
      properties:
        roomCode:
          type: string
        playerNames:
          type: array
          items:
            type: string
    Rush10RoomSession:
      type: object
      required: [roomCode, playerToken, playerId, room]
      properties:
        roomCode:
          type: string
        playerToken:
          type: string
        playerId:
          type: string
        room:
          $ref: "#/components/schemas/Rush10RoomView"
    Rush10PlayerAction:
      type: object
      required: [playerToken, action]
      properties:
        playerToken:
          type: string
        action:
          type: string
          enum: [draw-deck, draw-discard, lay-phase, hit, discard, set-avatar, set-name, leave, add-bot, remove-bot, set-bot-level]
        playerName:
          type: string
          minLength: 1
          maxLength: 20
        avatar:
          type: string
          enum: [fox, cat, bear, rabbit, owl, panda, frog, penguin]
        cardIds:
          type: array
          items:
            type: string
        melds:
          type: array
          items:
            $ref: "#/components/schemas/Rush10MeldInput"
        meldId:
          type: string
        targetPlayerId:
          type: string
        botLevel:
          $ref: "#/components/schemas/Rush10BotLevel"
        declaredValue:
          type: ["integer", "null"]
        declaredColor:
          type: ["string", "null"]
    Rush10BotLevel:
      type: string
      enum: [easy, medium, hard]
    Rush10TestRoomCreate:
      type: object
      required: [scenario, playerCount]
      properties:
        scenario:
          type: string
          enum: [play, level-10, player-left]
        playerCount:
          type: integer
          minimum: 2
          maximum: 6
    Rush10TestRoom:
      type: object
      required: [roomCode, sessions]
      properties:
        roomCode:
          type: string
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Rush10TestSession"
    Rush10TestSession:
      type: object
      required: [playerId, playerToken, name]
      properties:
        playerId:
          type: string
        playerToken:
          type: string
        name:
          type: string
    Rush10PlayerTokenInput:
      type: object
      required: [playerToken]
      properties:
        playerToken:
          type: string
    Rush10MeldInput:
      type: object
      required: [type, cardIds]
      properties:
        type:
          type: string
          enum: [group, sequence, color]
        cardIds:
          type: array
          items:
            type: string
        declaredValue:
          type: ["integer", "null"]
        declaredColor:
          type: ["string", "null"]
    Rush10Card:
      type: object
      required: [id, type, value, color]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [number, wild, skip]
        value:
          type: ["integer", "null"]
        color:
          type: ["string", "null"]
    Rush10Player:
      type: object
      required: [id, name, phase, score, handCount, isHost, isBot, hasLaidPhase]
      properties:
        id:
          type: string
        name:
          type: string
        avatar:
          type: string
          enum: [fox, cat, bear, rabbit, owl, panda, frog, penguin]
        phase:
          type: integer
        score:
          type: integer
        handCount:
          type: integer
        isHost:
          type: boolean
        isBot:
          type: boolean
          description: A bot run by the server.
        botLevel:
          $ref: "#/components/schemas/Rush10BotLevel"
        hasLaidPhase:
          type: boolean
    Rush10Meld:
      type: object
      required: [id, ownerId, type, cardIds, cards, declaredValue, declaredColor, low, high]
      properties:
        id:
          type: string
        ownerId:
          type: string
        type:
          type: string
          enum: [group, sequence, color]
        cardIds:
          type: array
          items:
            type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Rush10Card"
        declaredValue:
          type: ["integer", "null"]
        declaredColor:
          type: ["string", "null"]
        low:
          type: ["integer", "null"]
        high:
          type: ["integer", "null"]
    Rush10RoomView:
      type: object
      required:
        - roomCode
        - status
        - players
        - hostPlayerId
        - currentPlayerId
        - turnState
        - currentPhase
        - drawPileCount
        - discardTop
        - hand
        - melds
        - roundNumber
        - message
        - winnerId
        - endReason
        - endedByPlayerId
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Rush10GameEvent"
        roomCode:
          type: string
        status:
          type: string
          enum: [waiting, playing, round-over, finished]
        players:
          type: array
          items:
            $ref: "#/components/schemas/Rush10Player"
        hostPlayerId:
          type: string
        currentPlayerId:
          type: ["string", "null"]
        turnState:
          type: string
          enum: [draw, discard, waiting]
        currentPhase:
          type: integer
        drawPileCount:
          type: integer
        discardTop:
          anyOf:
            - $ref: "#/components/schemas/Rush10Card"
            - type: "null"
        hand:
          type: array
          items:
            $ref: "#/components/schemas/Rush10Card"
        melds:
          type: array
          items:
            $ref: "#/components/schemas/Rush10Meld"
        roundNumber:
          type: integer
        message:
          type: string
        winnerId:
          type: ["string", "null"]
        endReason:
          description: Why a finished game ended; null until it does.
          anyOf:
            - type: string
              enum: [level-10, player-left]
            - type: "null"
        endedByPlayerId:
          description: The Level 10 winner, or the player who left.
          type: ["string", "null"]
    Rush10GameEvent:
      type: object
      required: [id, playerId, kind, createdAt, card]
      properties:
        id:
          type: string
        playerId:
          type: string
        targetPlayerId:
          type: string
          description: The opponent targeted by a discarded Skip.
        kind:
          type: string
          enum: [draw-deck, draw-discard, discard, lay-phase, hit, deal]
        createdAt:
          type: number
        card:
          anyOf:
            - $ref: "#/components/schemas/Rush10Card"
            - type: "null"

