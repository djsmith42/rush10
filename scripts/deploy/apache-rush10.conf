	# Rush 10 (include inside the thesmithfam.org *:443 VirtualHost).
	# API goes to the Node service; the static build lives in DocumentRoot/rush10.
	# Game requests are small and quick: cap bodies at 16 KB and give up on a stuck backend after 10s.
	ProxyPass /rush10/api http://127.0.0.1:3010/api timeout=10
	ProxyPassReverse /rush10/api http://127.0.0.1:3010/api
	<Location /rush10/api>
		LimitRequestBody 16384
	</Location>
	# rush10-body-limit: LimitRequestBody does not apply to streamed proxy bodies.
	RewriteCond %{REQUEST_URI} ^/rush10/api/
	RewriteCond expr "%{HTTP:Content-Length} -gt 16384"
	RewriteRule ^ - [R=413,L]
	<Directory /home/vhosts/thesmithfam.org/rush10>
		RewriteEngine On
		RewriteBase /rush10/
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteRule . /rush10/index.html [L]
	</Directory>
	# rush10-headers: only our own scripts run, and no other site can frame the game.
	# Motion and Radix inject <style> tags, so styles need 'unsafe-inline'.
	<Location /rush10>
		Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
		Header always set X-Content-Type-Options "nosniff"
		Header always set Referrer-Policy "same-origin"
	</Location>
