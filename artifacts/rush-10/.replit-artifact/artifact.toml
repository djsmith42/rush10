kind = "web"
previewPath = "/"
title = "Rush 10"
description = "A browser-based multiplayer card game where friends race through ten levels using Groups and Sequences. Create a room, invite players with a code, and play together in real time."
version = "1.0.0"
id = "artifacts/rush-10"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23522

[services.development]
run = "pnpm --filter @workspace/rush-10 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rush-10", "run", "build" ]
serve = "static"
publicDir = "artifacts/rush-10/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23522"
BASE_PATH = "/"
